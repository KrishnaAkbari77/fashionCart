<!DOCTYPE html>
<html lang="en">
<head>
    <title>VastraHub | Men</title>

    <!-- global css -->
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/fonts.css">
    <link rel="stylesheet" href="css/style.css">

    <!-- product page css -->
    <link rel="stylesheet" href="css/product.css">
</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<section>
    <div class="pro-container">
        <!-- Image -->
         <div class="image-section">
             <div class="thumbnails">
            <img src="https://via.placeholder.com/80x100" onclick="changeImg(this)">
            <img src="https://via.placeholder.com/80x100/ffc0cb" onclick="changeImg(this)">
            <img src="https://via.placeholder.com/80x100/f4a460" onclick="changeImg(this)">
        </div>

        <div class="main-image">
            <img id="mainImg" src="https://via.placeholder.com/420x520">
        </div>
         </div>
         <!-- Product Info -->
        <div class="product-info">
            <div class="pro-info">
            <div class="brand">glitchez</div>
        <div class="product-title">Varsity Print Oversized T-shirt</div>

        <div class="rating"><i class="fa-solid fa-star"></i> 4.3 | 319 Ratings</div>

        <div class="price">
            ₹433 
        </div>

        <div class="tax">inclusive of all taxes</div>

        <div class="size-title">
            SELECT SIZE <span style="color:red;font-size:12px;">SIZE CHART</span>
        </div>

        <div class="size-box">
            <button onclick="selectSize(this)">XS</button>
            <button onclick="selectSize(this)">S</button>
            <button onclick="selectSize(this)">M</button>
            <button onclick="selectSize(this)">L</button>
            <button onclick="selectSize(this)">XL</button>
        </div>
        </div>
        <div class="buttons">
            <a href="cart.html" class="btn cart-btn">  <i class="fa-solid fa-cart-shopping"></i> Add to Cart</a>
            <a href="wishlist.html" class="btn wishlst-btn"><i class="fa-solid fa-heart"></i> Wishlist</a>
           
            
        </div>
    </div>
</div>
        </div>
    
</section>

<!-- FOOTER -->
<div id="footer"></div>

<script>
    /* load header */
    fetch("header.html")
        .then(res => res.text())
        .then(data => document.getElementById("header").innerHTML = data);

    

    /* load footer */
    fetch("footer.html")
        .then(res => res.text())
        .then(data => document.getElementById("footer").innerHTML = data);
</script>

</body>
</html>
